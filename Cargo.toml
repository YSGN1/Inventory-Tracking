[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
uuid = { version = "1", features = ["v7", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = { version = "10", features = ["uuid-impl", "serde-json-impl"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "uuid", "macros", "migrate"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs"] }
tempfile = "3"
stok-core = { path = "crates/stok-core" }
stok-db = { path = "crates/stok-db" }

# Parola özetleme testlerde de hızlı çalışsın.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
